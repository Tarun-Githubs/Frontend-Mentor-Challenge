<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog preview card</title>
    <link rel="shortcut icon" href="./assets/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="rectangle">
        <div class="inner-rectangle"><img src="./assets/images/illustration-article.svg" alt="hero-image"></div>
        <div class="tag">Learning</div>
        <div class="publish">Published 4 April 2026</div>
        <div class="course-title">HTML & CSS Foundation</div>

            presentation</div>
        <div class="profile-pic"><img src="./assets/images/image-avatar.webp" alt="profile pic">
            <div class="name">Greg Hopper</div>
        </div>
    </div>
</body>

</html>
